<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Pop // GAME_ZONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/style.css">
<style>
  #popCanvas { touch-action: none; }
</style>
</head>
<body>

<div class="header">
  <a class="brand" href="../index.html">GAME_ZONE<span class="dim">.arcade</span></a>
  <div class="status"><span class="led"></span>1P</div>
</div>

<div class="back-wrap"><a class="back-link" href="../index.html">← back to menu</a></div>
<div class="game-title">BALLOON POP<span class="sub">1 player · tap fast, avoid the bombs</span></div>

<div class="game-panel">
  <div class="console">
    <div class="info-bar">
      <span>SCORE <span class="lcd" id="score">0</span></span>
      <span>TIME <span class="lcd" id="timeLeft">60</span></span>
      <span>BEST <span class="lcd" id="best">0</span></span>
    </div>
    <canvas id="popCanvas" width="320" height="420"></canvas>
    <div><button class="btn" id="startBtn">▶ Start</button></div>
    <p style="font-family:var(--font-mono);font-size:0.68em;color:var(--text-dim);margin-top:10px;">tap balloons to pop · gold = bonus · red spike = avoid, costs a life</p>
    <p style="font-family:var(--font-mono);font-size:0.78em;color:var(--text-dim);margin-top:4px;">LIVES <span class="lcd" id="lives">3</span></p>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="tag" id="overlayTag">SYSTEM</div>
    <h2 id="overlayTitle">TIME'S UP</h2>
    <p id="overlaySubtitle">Score 0</p>
    <button class="btn" id="overlayBtn">Continue</button>
  </div>
</div>

<script src="../shared/common.js"></script>
<script>
(function(){
  const canvas = document.getElementById('popCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('timeLeft');
  const livesEl = document.getElementById('lives');
  const bestEl = document.getElementById('best');

  best = parseInt(localStorage.getItem('popBest') || '0');
  bestEl.textContent = best;

  let balloons, score, lives, timeLeft, running, spawnTimer, spawnInterval, rafId, lastTime, countdownTimer, popEffects;

  const TYPES = [
    { key:'normal', color:'#3dffa0', points:10, weight:70, radius:22 },
    { key:'gold',   color:'#ffe66d', points:30, weight:15, radius:20 },
    { key:'bomb',   color:'#ff5f5f', points:0,  weight:15, radius:22, isBomb:true }
  ];

  function pickType(){
    const total = TYPES.reduce((s,t)=>s+t.weight,0);
    let r = Math.random()*total;
    for (const t of TYPES) { if (r < t.weight) return t; r -= t.weight; }
    return TYPES[0];
  }

  function spawnBalloon(){
    const type = pickType();
    balloons.push({
      type,
      x: type.radius + Math.random()*(W - type.radius*2),
      y: H + type.radius,
      speed: 1 + Math.random()*1.5,
      wobble: Math.random()*Math.PI*2,
      popped: false
    });
  }

  function init(){
    balloons = [];
    popEffects = [];
    score = 0;
    lives = 3;
    timeLeft = 60;
    spawnInterval = 900;
    scoreEl.textContent = 0;
    livesEl.textContent = 3;
    timeEl.textContent = 60;
    running = true;
    lastTime = performance.now();
    spawnTimer = 0;

    clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
      if (!running) return;
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 15) spawnInterval = 550;
      if (timeLeft <= 0) endGame('SYSTEM', "TIME'S UP", `Final score ${score} · Best ${Math.max(score,best)}`);
    }, 1000);

    cancelAnimationFrame(rafId);
    loop(performance.now());
  }

  function endGame(tag, title, subtitle){
    running = false;
    clearInterval(countdownTimer);
    if (score > best) { best = score; localStorage.setItem('popBest', best); bestEl.textContent = best; }
    showOverlay(tag, title, subtitle, init, score >= best && score > 0);
  }

  function loop(now){
    const dt = now - lastTime;
    lastTime = now;
    if (running) {
      spawnTimer += dt;
      if (spawnTimer > spawnInterval) { spawnTimer = 0; spawnBalloon(); }
      balloons.forEach(b => {
        b.y -= b.speed;
        b.wobble += 0.05;
      });
      balloons = balloons.filter(b => b.y > -40);
      popEffects = popEffects.filter(p => { p.life -= dt; return p.life > 0; });
    }
    draw();
    rafId = requestAnimationFrame(loop);
  }

  function draw(){
    ctx.fillStyle = '#081310';
    ctx.fillRect(0,0,W,H);

    balloons.forEach(b => {
      const wob = Math.sin(b.wobble) * 4;
      ctx.save();
      ctx.translate(b.x + wob, b.y);
      // string
      ctx.strokeStyle = 'rgba(109,143,131,0.4)';
      ctx.beginPath();
      ctx.moveTo(0, b.type.radius);
      ctx.lineTo(0, b.type.radius + 14);
      ctx.stroke();
      // balloon body
      ctx.fillStyle = b.type.color;
      ctx.shadowColor = b.type.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.ellipse(0, 0, b.type.radius*0.85, b.type.radius, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
      if (b.type.isBomb) {
        ctx.strokeStyle = '#081310';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-8,-8); ctx.lineTo(8,8);
        ctx.moveTo(8,-8); ctx.lineTo(-8,8);
        ctx.stroke();
      }
      ctx.restore();
    });

    popEffects.forEach(p => {
      ctx.strokeStyle = p.color;
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, (1 - p.life/p.maxLife) * 30, 0, Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    });
  }

  function handleTap(x, y){
    if (!running) return;
    for (let i = balloons.length - 1; i >= 0; i--) {
      const b = balloons[i];
      const wob = Math.sin(b.wobble) * 4;
      const dx = x - (b.x + wob), dy = y - b.y;
      if (Math.hypot(dx, dy) < b.type.radius + 6) {
        popEffects.push({ x: b.x+wob, y: b.y, life: 300, maxLife: 300, color: b.type.color });
        if (b.type.isBomb) {
          lives--;
          livesEl.textContent = lives;
          if (lives <= 0) {
            balloons.splice(i,1);
            endGame('SYSTEM', 'OUT OF LIVES', `Final score ${score} · Best ${Math.max(score,best)}`);
            return;
          }
        } else {
          score += b.type.points;
          scoreEl.textContent = score;
        }
        balloons.splice(i,1);
        return;
      }
    }
  }

  function getCanvasPos(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    return { x: (clientX-rect.left) * (W/rect.width), y: (clientY-rect.top) * (H/rect.height) };
  }

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const pos = getCanvasPos(t.clientX, t.clientY);
      handleTap(pos.x, pos.y);
    }
  }, {passive:false});

  canvas.addEventListener('click', (e) => {
    const pos = getCanvasPos(e.clientX, e.clientY);
    handleTap(pos.x, pos.y);
  });

  document.getElementById('startBtn').addEventListener('click', init);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { running = false; clearInterval(countdownTimer); }
  });

  balloons = []; popEffects = [];
  running = false;
  draw();
})();
</script>

</body>
  </html>
